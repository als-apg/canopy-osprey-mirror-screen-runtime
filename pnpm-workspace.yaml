packages:
  - packages/*
  - apps/*

# fidelity/edm-batch branch only: consume the SDK packages from the sibling
# checkout so loop fixes propagate live instead of freezing at the published
# 0.1.0 tarballs (which also require NODE_AUTH_TOKEN for npm.pkg.github.com).
overrides:
  '@slaclab/canopy-client': link:../canopy-sdk-js/packages/client
  '@slaclab/canopy-react': link:../canopy-sdk-js/packages/react
  '@slaclab/canopy-shell': link:../canopy-sdk-js/packages/shell
  '@slaclab/canopy-screen-ir': link:../canopy-sdk-js/packages/screen-ir

# Dependency postinstall scripts we deliberately do not run: the Carbon and
# IBM Plex packages' scripts are ibmtelemetry hooks, and @parcel/watcher's
# native build is unused by our tsc-only builds. esbuild's postinstall only
# re-validates the platform binary that already ships as an optional
# dependency, so Vite works without it. pnpm 11 blocks dep builds by default
# (strictDepBuilds); every blocked build needs an explicit decision here.
allowBuilds:
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/react': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': false
  esbuild: false
