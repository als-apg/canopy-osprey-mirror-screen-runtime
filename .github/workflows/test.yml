name: Test

# NOTE: `pnpm install` in CI cannot succeed until the @slaclab SDK packages
# (canopy-client/react/shell) are published to GitHub Packages — the root
# package.json carries a TEMPORARY link: override to a sibling checkout for
# local development. Expected red until the SDK's first publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test
